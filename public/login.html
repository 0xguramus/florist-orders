<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FLOWTRACKER">
<meta name="application-name" content="FLOWTRACKER">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🌷%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>შესვლა · FLOWTRACKER</title>
<link rel="preload" href="/fonts/FiraGO-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/FiraGO-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<!-- აპის ფაილები წინასწარ, სანამ პაროლს წერთ: შესვლის შემდეგ გვერდი მყისიერად იხსნება -->
<link rel="prefetch" href="/style.css?v=11" as="style">
<link rel="prefetch" href="/app.js?v=11" as="script">
<link rel="prefetch" href="/fonts/FiraGO-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="prefetch" href="/fonts/FiraGO-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"FiraGO";src:url("/fonts/FiraGO-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"FiraGO";src:url("/fonts/FiraGO-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"FiraGO";src:url("/fonts/FiraGO-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"FiraGO";src:url("/fonts/FiraGO-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--ac:#1f6b4a;--ac-2:#e6f1ea;--ac-tx:#fff;--bg:#f4f2ee;--card:#fff;--field:#f6f5f2;--tx:#1b201d;--mu:#6f7772;--red:#c2412d;--red-2:#fdeeeb;--sh:0 1px 2px rgba(24,32,28,.05),0 6px 20px rgba(24,32,28,.06);--r:22px;--r-sm:12px}
@media (prefers-color-scheme:dark){:root{--ac:#5fc08f;--ac-2:#1d3328;--ac-tx:#0d1a13;--bg:#111513;--card:#1a1f1c;--field:#222825;--tx:#edf0ee;--mu:#97a29b;--red:#ff8a75;--red-2:#3a211d;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom));font-family:"FiraGO",-apple-system,BlinkMacSystemFont,"Noto Sans Georgian","Segoe UI",sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
.box{width:100%;max-width:380px;animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.logo{width:64px;height:64px;border-radius:20px;background:var(--ac-2);display:grid;place-items:center;font-size:32px;margin:0 auto 16px}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;text-align:center;margin:0 0 6px}
.sub{text-align:center;color:var(--mu);font-size:14px;margin:0 0 22px}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
label{display:block;font-size:13px;font-weight:500;color:var(--mu)}
.pw{position:relative;margin-top:6px}
input{display:block;width:100%;font:inherit;font-size:16px;color:var(--tx);padding:12px 52px 12px 14px;border:1.5px solid transparent;border-radius:var(--r-sm);background:var(--field);min-height:50px;-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s}
input:focus{outline:none;border-color:var(--ac);background:var(--card);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 14%,transparent)}
input.invalid{border-color:var(--red);background:var(--red-2)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--mu);display:grid;place-items:center;cursor:pointer}
.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.err{color:var(--red);font-size:13px;font-weight:500;min-height:0;margin:8px 2px 0}
.err:empty{display:none}
button.go{margin-top:16px;width:100%;font:inherit;font-size:15px;font-weight:600;border:0;border-radius:14px;min-height:52px;background:var(--ac);color:var(--ac-tx);box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 30%,transparent);cursor:pointer;transition:transform .12s,filter .15s}
button.go:active{transform:scale(.97)}
button.go:disabled{opacity:.7;cursor:progress}
.foot{text-align:center;font-size:12px;color:var(--mu);margin-top:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="box">
  <div class="logo" aria-hidden="true">🌷</div>
  <h1>FLOWTRACKER</h1>
  <p class="sub">შესასვლელად ჩაწერეთ პაროლი</p>
  <form class="card" id="f" method="post" action="/api/login" autocomplete="on">
    <input type="text" name="username" value="florist" autocomplete="username" hidden>
    <label for="pw">პაროლი</label>
    <div class="pw">
      <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
      <button type="button" class="eye" id="eye" aria-label="პაროლის ჩვენება"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button class="go" id="go" type="submit">შესვლა</button>
  </form>
  <p class="foot">ყვავილების მაღაზია</p>
</main>
<script>
(() => {
  const f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err'), go = document.getElementById('go');
  const MSG = { bad: 'პაროლი არასწორია.', many: 'ძალიან ბევრი მცდელობა. სცადეთ 15 წუთში.' };
  const e = new URLSearchParams(location.search).get('e');
  if (MSG[e]) { err.textContent = MSG[e]; pw.classList.add('invalid'); }
  document.getElementById('eye').onclick = () => { pw.type = pw.type === 'password' ? 'text' : 'password'; pw.focus(); };
  pw.addEventListener('input', () => { err.textContent = ''; pw.classList.remove('invalid'); });
  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    if (!pw.value) { err.textContent = 'ჩაწერეთ პაროლი.'; pw.classList.add('invalid'); return; }
    go.disabled = true; go.textContent = 'მოწმდება…'; err.textContent = '';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: pw.value }), credentials: 'same-origin' });
      if (r.ok) { location.replace('/'); return; }
      const d = await r.json().catch(() => ({}));
      err.textContent = d.error || 'შესვლა ვერ მოხერხდა. სცადეთ თავიდან.';
      pw.classList.add('invalid'); pw.select();
    } catch {
      err.textContent = 'ინტერნეტთან კავშირი ვერ მოხერხდა. სცადეთ თავიდან.';
    }
    go.disabled = false; go.textContent = 'შესვლა';
  });
})();
</script>
</body>
</html>
